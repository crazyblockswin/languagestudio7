ll screen</button></div><p class="hint">Use ← and → to change pictures. Space pauses or plays. Sounds begin after you press Play, as required by browsers.</p></main><audio id="sound" preload="metadata"></audio><script src="memory-lane-data.js"></script><script src="viewer.js"></script></body></html>
