:root{font-family:'Trebuchet MS',Arial,sans-serif;color:#173725}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8f4e8,#e9eddf);min-height:100vh}header{background:linear-gradient(100deg,#071b12,#123d27 65%,#071b12);border-bottom:4px solid #cda83c;text-align:center;padding:10px 18px 12px;box-shadow:0 10px 30px #071b1230}header img{display:block;width:min(850px,96%);height:auto;max-height:128px;object-fit:contain;margin:auto}main{max-width:970px;margin:34px auto;padding:0 18px 50px}.intro{text-align:center;margin-bottom:27px}.intro h1{font-size:clamp(29px,4vw,42px);color:#103923;margin:8px 0 10px}.intro p{font-size:clamp(17px,2vw,20px);line-height:1.55;color:#365345;margin:0 auto;max-width:760px}.language{display:flex;justify-content:center;align-items:center;gap:10px;margin:0 auto 26px;font-weight:800}.language select{font:inherit;font-size:17px;padding:9px 14px;border:2px solid #cda83c;border-radius:11px;color:white;background:#123d27}.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:19px}.step{background:#fffdf6;border:1px solid #e1ca85;border-radius:18px;overflow:hidden;box-shadow:0 8px 22px #092a1d18}.step-top{background:linear-gradient(100deg,#092719,#185038,#092719);border-bottom:3px solid #cda83c;padding:14px 19px;color:#f8e7ac;display:flex;align-items:center;gap:12px;font-size:21px;font-weight:900}.number{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:50%;background:linear-gradient(#ffe9a1,#d9aa3d);color:#163925;font-size:18px}.step p{font-size:18px;line-height:1.6;margin:0;padding:20px 23px 25px;color:#264735}.voice-step{grid-column:1/-1}.voice-step .step-top{background:linear-gradient(100deg,#0b3522,#246b48,#0b3522)}.voice-step p{background:#fff9e7}.closing{text-align:center;background:linear-gradient(100deg,#092719,#185038,#092719);border:2px solid #cda83c;border-radius:16px;color:#fff1b8;padding:19px;margin:26px 0 20px;font-size:21px;font-weight:900}.back{display:block;width:max-content;max-width:100%;margin:0 auto;padding:13px 30px;border:2px solid #e8c66d;border-radius:30px;background:linear-gradient(180deg,#1d6745,#0a2c1d);color:#ffe7a2;text-decoration:none;font-size:18px;font-weight:900;box-shadow:0 5px 14px #092a1d40}.back:hover{filter:brightness(1.15)}@media(max-width:650px){.steps{grid-template-columns:1fr}header{padding:16px}.step-top{font-size:19px}.step p{font-size:17px}.closing{font-size:18px}}
.video-guide{max-width:850px;margin:0 auto 30px;text-align:center}.video-guide h2{color:#103923;font-size:clamp(21px,3vw,28px);margin:0 0 13px}.video-frame{aspect-ratio:16/9;border:3px solid #cda83c;border-radius:15px;overflow:hidden;background:#092719;box-shadow:0 8px 22px #092a1d25}.video-frame iframe{display:block;width:100%;height:100%;border:0}.video-controls{display:flex;justify-content:center;gap:14px;margin:14px auto 0}.video-controls button{font:800 18px Trebuchet MS,Arial,sans-serif;padding:11px 28px;border:2px solid #cda83c;border-radius:28px;background:linear-gradient(180deg,#1d6745,#0a2c1d);color:#ffe7a2;cursor:pointer}.video-controls button:hover{filter:brightness(1.15)}

ection class="steps"><article class="step"><div class="step-top"><span class="number">1</span><span id="t2"></span></div><p id="t3"></p></article><article class="step"><div class="step-top"><span class="number">2</span><span id="t4"></span></div><p id="t5"></p></article><article class="step"><div class="step-top"><span class="number">3</span><span id="t6"></span></div><p id="t7"></p></article><article class="step"><div class="step-top"><span class="number">4</span><span id="t8"></span></div><p id="t9"></p></article><article class="step voice-step"><div class="step-top"><span class="number">5</span><span id="t10"></span></div><p id="t11"></p></article></section><p class="closing" id="t12"></p><a class="back" href="index.html" id="t13"></a></main><script>const translations={"es":["Cómo funciona Language Studio 7","Aprender un idioma debe sentirse como una aventura. Así puedes comenzar:","Elige tus idiomas","Selecciona tu idioma nativo y después el idioma que quieres aprender en una lección o aventura.","Aprende lo básico","Empieza con números, imágenes, colores, expresiones y palabras cotidianas.","Explora aventuras","Visita escenas emocionantes, pulsa objetos para descubrir palabras, escuchar sonidos y probar actividades y desafíos.","Escucha, repite y disfruta","Escucha palabras pronunciadas, practica a tu ritmo y vuelve cuando quieras.","Voz mejorada — primera descarga","Para una voz más natural, elige Voz mejorada. La primera vez que uses una voz, deberá descargarse, así que espera un poco más. Después de esa descarga inicial, la voz comenzará mucho más rápido. También puedes elegir Voz estándar.","Sin registro. Sin iniciar sesión. ¡Y es GRATIS!","Volver al inicio"],"fr":["Comment fonctionne Language Studio 7","Apprendre une langue devrait être une aventure. Voici comment commencer :","Choisissez vos langues","Sélectionnez votre langue maternelle, puis la langue à apprendre dans une leçon ou une aventure.","Apprenez les bases","Commencez par les nombres, les images, les couleurs, les expressions et les mots du quotidien.","Explorez les aventures","Visitez des scènes passionnantes, cliquez sur des objets pour découvrir des mots, entendre des sons et relever des défis.","Écoutez, répétez et amusez-vous","Écoutez les mots prononcés, entraînez-vous à votre rythme et revenez quand vous voulez.","Voix améliorée — premier téléchargement","Pour une voix plus naturelle, choisissez la voix améliorée. Lors de la première utilisation, la voix doit être téléchargée : prévoyez donc un peu de temps. Après ce premier téléchargement, elle démarre beaucoup plus vite. Vous pouvez aussi choisir la voix standard.","Sans inscription. Sans connexion. Et c’est GRATUIT !","Retour à l’accueil"],"de":["So funktioniert Language Studio 7","Sprachenlernen soll sich wie ein Abenteuer anfühlen. So geht’s los:","Wähle deine Sprachen","Wähle deine Muttersprache und dann in einer Lektion oder einem Abenteuer die Sprache, die du lernen möchtest.","Lerne die Grundlagen","Beginne mit Zahlen, Bildern, Farben, Ausdrücken und Alltagswörtern.","Entdecke Abenteuer","Erkunde spannende Szenen, klicke auf Objekte, entdecke Wörter, höre Geräusche und probiere Aufgaben aus.","Hören, wiederholen und Spaß haben","Höre gesprochene Wörter, übe in deinem Tempo und komm jederzeit zurück.","Verbesserte Stimme — erster Download","Für eine natürlichere Sprachausgabe wähle die verbesserte Stimme. Bei der ersten Verwendung muss die Stimme heruntergeladen werden. Das kann etwas dauern. Nach diesem ersten Download startet sie deutlich schneller. Du kannst auch die Standardstimme wählen.","Keine Anmeldung. Kein Login. Und KOSTENLOS!","Zur Startseite"],"it":["Come funziona Language Studio 7","Imparare una lingua dovrebbe essere un’avventura. Ecco come iniziare:","Scegli le tue lingue","Seleziona la tua lingua madre, poi quella che vuoi imparare in una lezione o avventura.","Impara le basi","Inizia con numeri, immagini, colori, espressioni e parole quotidiane.","Esplora le avventure","Visita scene emozionanti, tocca gli oggetti per scoprire parole, ascoltare suoni e provare attività e sfide.","Ascolta, ripeti e divertiti","Ascolta le parole, esercitati al tuo ritmo e torna quando vuoi.","Voce avanzata — primo download","Per una voce più naturale, scegli Voce avanzata. Al primo utilizzo, la voce deve essere scaricata, quindi potrebbe volerci un po’ di tempo. Dopo il download iniziale, si avvia molto più velocemente. Puoi anche scegliere Voce standard.","Nessuna registrazione. Nessun accesso. Ed è GRATIS!","Torna alla home"],"pt":["Como funciona o Language Studio 7","Aprender um idioma deve ser uma aventura. Veja como começar:","Escolha os seus idiomas","Selecione o seu idioma nativo e depois o idioma que quer aprender numa lição ou aventura.","Aprenda o básico","Comece com números, imagens, cores, expressões e palavras do dia a dia.","Explore aventuras","Visite cenários emocionantes, clique em objetos para descobrir palavras, ouvir sons e experimentar atividades e desafios.","Ouça, repita e divirta-se","Ouça palavras faladas, pratique ao seu ritmo e volte quando quiser.","Voz melhorada — primeira transferência","Para uma voz mais natural, escolha Voz melhorada. Na primeira utilização, a voz precisa de ser transferida, por isso aguarde um pouco mais. Depois dessa primeira transferência, a voz inicia muito mais depressa. Também pode escolher Voz padrão.","Sem cadastro. Sem login. E é GRÁTIS!","Voltar ao início"],"no":["Slik fungerer Language Studio 7","Å lære et språk skal føles som et eventyr. Slik kommer du i gang:","Velg språkene dine","Velg morsmålet ditt, og deretter språket du vil lære i en leksjon eller et eventyr.","Lær det grunnleggende","Begynn med tall, bilder, farger, uttrykk og hverdagsord.","Utforsk eventyr","Besøk spennende scener, klikk på gjenstander for å oppdage ord, høre lyder og prøve aktiviteter og utfordringer.","Lytt, gjenta og ha det gøy","Hør ord bli sagt, øv i ditt eget tempo og kom tilbake når du vil.","Forbedret stemme — første nedlasting","Velg Forbedret stemme for mer naturlig tale. Første gang du bruker en stemme, må den lastes ned, så det kan ta litt ekstra tid. Etter den første nedlastingen starter stemmen mye raskere. Du kan også velge Standardstemme.","Ingen registrering. Ingen innlogging. Og det er GRATIS!","Tilbake til forsiden"],"en":["How Language Studio 7 Works","Learning a language should feel like an adventure. Here's how to get started:","Choose your languages","Select your native language, then choose the language you want to learn in a lesson or Adventure.","Learn the basics","Start with numbers, pictures, colors, expressions, and everyday words.","Explore Adventures","Visit exciting scenes, click objects to discover words, hear sounds, and try activities and challenges.","Listen, repeat, and enjoy","Hear spoken words, practice at your own pace, and return whenever you like.","Enhanced Voice — first-time download","For more natural-sounding speech, choose Enhanced Voice. The first time you use a voice, it needs to download, so please allow a little extra time. After that initial download, the voice starts much faster. You can also choose Standard Voice.","No sign-up. No login. And it's FREE!","Back to Home"]};const picker=document.getElementById('lang');function setLanguage(lang){const words=translations[lang]||translations.en;for(let i=0;i<14;i++)document.getElementById('t'+i).textContent=words[i]||translations.en[i];document.documentElement.lang=lang}let initial='en';try{const query=new URLSearchParams(location.search).get('tabnative');initial=query||localStorage.getItem('talkabee-native-language')||'en'}catch(e){}if(!translations[initial])initial='en';picker.value=initial;setLanguage(initial);picker.addEventListener('change',()=>{setLanguage(picker.value);try{localStorage.setItem('talkabee-native-language',picker.value)}catch(e){}});</script><script>
(function(){
  const frame=document.getElementById('intro-video');
  const play=document.getElementById('video-play');
  const stop=document.getElementById('video-stop');
  let playing=false;
  function command(func){if(frame.contentWindow)frame.contentWindow.postMessage(JSON.stringify({event:'command',func:func,args:[]}), 'https://www.youtube.com');}
  play.addEventListener('click',function(){command(playing?'pauseVideo':'playVideo');playing=!playing;});
  stop.addEventListener('click',function(){command('stopVideo');playing=false;});
  window.addEventListener('message',function(event){
    if(event.origin!=='https://www.youtube.com'&&event.origin!=='https://www.youtube.com')return;
    try{const data=typeof event.data==='string'?JSON.parse(event.data):event.data;
      if(data.event==='onStateChange'){playing=data.info===1;}
    }catch(e){}
  });
  frame.addEventListener('load',function(){frame.contentWindow.postMessage(JSON.stringify({event:'listening',id:'intro-video'}),'https://www.youtube.com');});
})();
</script></body></html>
